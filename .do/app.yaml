# DigitalOcean App Platform spec (§10).
# Create once:  doctl apps create --spec .do/app.yaml
# Thereafter it self-updates on push to the configured branch.
# Set the GitHub App secrets (GITHUB_*) + SESSION_SECRET in the DO Control Panel (Encrypted);
# they are intentionally NOT in this file.
name: cadence
region: blr1
features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
services:
  - name: web
    github:
      repo: chordsnstrings/projectmanager
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm run start:server
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /healthz
    envs:
      # NODE_ENV must NOT be production at BUILD time, or npm ci skips devDeps
      # (tsc/vite/prisma) and the build fails. Production at run time only.
      - { key: NODE_ENV, value: production, scope: RUN_TIME }
      - { key: DATABASE_URL, value: ${db.DATABASE_URL}, scope: RUN_TIME }
      - { key: APP_BASE_URL, value: ${APP_URL}, scope: RUN_TIME }
      - { key: ADMIN_GITHUB_LOGINS, value: "chordsnstrings,riaz4519", scope: RUN_TIME }
      - { key: SESSION_SECRET, scope: RUN_TIME, type: SECRET }
      - { key: GITHUB_APP_ID, scope: RUN_AND_BUILD_TIME, type: SECRET }
      - { key: GITHUB_APP_PRIVATE_KEY, scope: RUN_TIME, type: SECRET }
      - { key: GITHUB_CLIENT_ID, scope: RUN_AND_BUILD_TIME, type: SECRET }
      - { key: GITHUB_CLIENT_SECRET, scope: RUN_TIME, type: SECRET }
      - { key: GITHUB_WEBHOOK_SECRET, scope: RUN_TIME, type: SECRET }
      # Email digests (SMTP). Values set in the DO Control Panel / via API.
      - { key: SMTP_HOST, scope: RUN_TIME }
      - { key: SMTP_PORT, scope: RUN_TIME }
      - { key: SMTP_USER, scope: RUN_TIME, type: SECRET }
      - { key: SMTP_PASS, scope: RUN_TIME, type: SECRET }
      - { key: MAIL_FROM, scope: RUN_TIME }
      - { key: DIGEST_TO, scope: RUN_TIME }
      # Static bearer token for the external activity-check robot (/api/integrations/*).
      - { key: CADENCE_API_TOKEN, scope: RUN_TIME, type: SECRET }
      # Web Push (VAPID). Generate a pair with `npx web-push generate-vapid-keys`
      # and set the values in the DO Control Panel / via API. The public key is
      # not secret (it's sent to every browser); the private key is. Push is
      # dormant until both are present (toggle hidden, endpoints report disabled).
      - { key: VAPID_PUBLIC_KEY, scope: RUN_TIME }
      - { key: VAPID_SUBJECT, scope: RUN_TIME, value: "mailto:chordsnstrings@users.noreply.github.com" }
      - { key: VAPID_PRIVATE_KEY, scope: RUN_TIME, type: SECRET }
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: chordsnstrings/projectmanager
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build:db
    run_command: npm run migrate:deploy
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - { key: DATABASE_URL, value: ${db.DATABASE_URL}, scope: RUN_TIME }
  - name: reconcile
    kind: SCHEDULED
    schedule:
      cron: "*/15 * * * *" # DO requires >= 15-min interval
    github:
      repo: chordsnstrings/projectmanager
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm run reconcile
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - { key: DATABASE_URL, value: ${db.DATABASE_URL}, scope: RUN_TIME }
  - name: digest
    kind: SCHEDULED
    schedule:
      cron: "0 * * * *" # hourly; each recipient is mailed at DIGEST_HOUR in their own timezone
    github:
      repo: chordsnstrings/projectmanager
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm run digest
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - { key: DATABASE_URL, value: ${db.DATABASE_URL}, scope: RUN_TIME }
      - { key: APP_BASE_URL, scope: RUN_TIME }
      - { key: SMTP_HOST, scope: RUN_TIME }
      - { key: SMTP_PORT, scope: RUN_TIME }
      - { key: SMTP_USER, scope: RUN_TIME, type: SECRET }
      - { key: SMTP_PASS, scope: RUN_TIME, type: SECRET }
      - { key: MAIL_FROM, scope: RUN_TIME }
      - { key: DIGEST_TO, scope: RUN_TIME }
  - name: login-check
    kind: SCHEDULED
    schedule:
      cron: "0 * * * *" # hourly; acts once/day at LOGIN_CHECK_HOUR (local), never on Friday
    github:
      repo: chordsnstrings/projectmanager
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm run login-check
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - { key: DATABASE_URL, value: ${db.DATABASE_URL}, scope: RUN_TIME }
      - { key: APP_BASE_URL, scope: RUN_TIME }
      - { key: SMTP_HOST, scope: RUN_TIME }
      - { key: SMTP_PORT, scope: RUN_TIME }
      - { key: SMTP_USER, scope: RUN_TIME, type: SECRET }
      - { key: SMTP_PASS, scope: RUN_TIME, type: SECRET }
      - { key: MAIL_FROM, scope: RUN_TIME }
      - { key: URGENT_NOTIFY_EMAILS, scope: RUN_TIME }
      - { key: LOGIN_CHECK_HOUR, scope: RUN_TIME }
databases:
  - name: db
    engine: PG
    version: "17"
    production: true
    cluster_name: cadence-db
